services:
  - type: web
    name: callsense-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false # set to your deployed frontend URL after first deploy
      - key: GEMINI_API_KEY
        sync: false
      - key: SMALLEST_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
