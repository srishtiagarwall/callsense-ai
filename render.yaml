services:
  - type: web
    name: callsense-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false # set to your deployed frontend URL
      - key: GEMINI_API_KEY
        sync: false
      - key: SMALLEST_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false

  - type: web
    name: callsense-ai
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    dockerBuildArgs:
      NEXT_PUBLIC_API_BASE_URL:
        sync: false # set to your deployed backend URL, e.g. https://callsense-backend.onrender.com
